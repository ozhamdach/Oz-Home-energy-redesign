name: QA

on:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build preview site (noindex) + Pages variant + redirect config
        run: |
          node scripts/build.js
          node scripts/build-pages.js
          node scripts/build-redirects.js

      - name: Static QA checks — preview build
        run: node scripts/qa-static-checks.js

      - name: Build production-mode site into a throwaway dir + static QA
        run: |
          SITE_OUT_DIR=site-prod-check BUILD_TARGET=production node scripts/build.js
          node scripts/qa-static-checks.js --production
          rm -rf site-prod-check

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the built site
        run: |
          (cd site && python3 -m http.server 8811 &)
          # Give the server a moment to bind before the suite starts hitting it.
          for i in $(seq 1 10); do
            curl -sf http://localhost:8811/ >/dev/null && break
            sleep 1
          done

      - name: Run Playwright QA suite (Chromium — Safari/Firefox not covered)
        run: node scripts/qa-playwright.js

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa-screenshots/
          retention-days: 14
