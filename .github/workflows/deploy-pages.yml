name: Deploy preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        # Deliberately no env vars beyond what the job environment sets
        # itself — in particular, never ALLOW_DRAFT=true. ALLOW_DRAFT is a
        # local-only editorial review mode (see scripts/build.js's own
        # top-of-file comment) that shows draft Projects/Products content
        # and other closed publishGate/NAV:key gates; this workflow's
        # output is what the public actually sees, so every gate in
        # src/data/site-status.json must be respected here exactly as
        # authored. If a step is ever added to this job that reviews draft
        # content, it must write to its own throwaway directory, never
        # site/ or pages-dist/ (scripts/build.js refuses that combination
        # outright) — never add ALLOW_DRAFT to this step.
        run: |
          node scripts/build.js
          node scripts/build-pages.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # This repo has never had Pages enabled before, so ask the action
          # to create/enable the Pages site (build type: workflow) itself
          # rather than erroring when it can't find an existing one.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
