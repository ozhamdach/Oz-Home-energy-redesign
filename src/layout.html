<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ANALYTICS: NOT ACTIVE. See docs/analytics-integration.md before enabling
     anything here — activating a tag without confirming the production
     tracking plan first (GTM container ID, whether GA4/Ads/Meta Pixel are
     already live elsewhere) risks double-counting conversions. The line
     below only declares the dataLayer array (standard, recommended GTM
     practice — queueing events before the container script itself loads)
     and does not transmit anything anywhere by itself: with no GTM
     container script installed, nothing ever reads this array. This build
     already pushes phone-click, email-click, form-start and form-step
     events into it (see site/js/main.js and site/js/assessment.js), so
     wiring up real analytics later needs no further code changes here —
     only inserting the real container snippet Google Tag Manager gives you
     (head + body <noscript>, per Google's own install instructions) in
     place of this comment. -->
<script>window.dataLayer = window.dataLayer || [];</script>
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<!-- Production origin: https://ozhomeenergy.com.au (non-www). The current
     production site's www subdomain redirects to this apex domain, so every
     canonical/OG/schema URL below uses it consistently — pointing them at
     www would canonicalise against a redirecting hostname. See
     docs/legacy-url-migration.md for the full rationale and migration plan. -->
<link rel="canonical" href="https://ozhomeenergy.com.au{{CANONICAL}}">
<!-- {{ROBOTS_META}} is "noindex, nofollow" by default (preview build) and
     only becomes "index, follow" when scripts/build.js is run with
     BUILD_TARGET=production — see docs/09-seo-preview-safety.md. Never index
     a preview build; keep this in sync with site/robots.txt. -->
<meta name="robots" content="{{ROBOTS_META}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Oz Home Energy">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="https://ozhomeenergy.com.au{{CANONICAL}}">
<meta property="og:image" content="https://ozhomeenergy.com.au/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Oz Home Energy — Sydney solar, battery, EV charging and electrical contractor">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Electrician",
  "name": "Oz Home Energy",
  "url": "https://ozhomeenergy.com.au",
  "telephone": "+61435336336",
  "areaServed": [{"@type":"City","name":"Sydney"},{"@type":"State","name":"New South Wales"}],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Sydney",
    "addressRegion": "NSW",
    "addressCountry": "AU"
  },
  "identifier": {
    "@type": "PropertyValue",
    "name": "NSW Electrical Contractor Licence",
    "value": "382607C"
  }
}
</script>
{{SCHEMA}}
{{EXTRA_HEAD}}
</head>
<body>
{{HEADER}}
<main id="main">
{{BODY}}
</main>
{{FOOTER}}
<script src="/js/main.js" defer></script>
{{EXTRA_SCRIPT}}
</body>
</html>
