<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="https://www.ozhomeenergy.com.au{{CANONICAL}}">
<!-- {{ROBOTS_META}} is "noindex, nofollow" by default (preview build) and
     only becomes "index, follow" when scripts/build.js is run with
     BUILD_TARGET=production — see docs/09-seo-preview-safety.md. Never index
     a preview build; keep this in sync with site/robots.txt. -->
<meta name="robots" content="{{ROBOTS_META}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Oz Home Energy">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="https://www.ozhomeenergy.com.au{{CANONICAL}}">
<!-- OWNER CONFIRMATION REQUIRED: replace with a real 1200x630 installation photograph before launch -->
<meta property="og:image" content="https://www.ozhomeenergy.com.au/img/favicon.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Electrician",
  "name": "Oz Home Energy",
  "url": "https://www.ozhomeenergy.com.au",
  "telephone": "+61420113216",
  "areaServed": [{"@type":"City","name":"Sydney"},{"@type":"State","name":"New South Wales"}],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Sydney",
    "addressRegion": "NSW",
    "addressCountry": "AU"
  },
  "identifier": {
    "@type": "PropertyValue",
    "name": "NSW Electrical Contractor Licence",
    "value": "382607C"
  }
}
</script>
{{SCHEMA}}
{{EXTRA_HEAD}}
</head>
<body>
{{HEADER}}
<main id="main">
{{BODY}}
</main>
{{FOOTER}}
<script src="/js/main.js" defer></script>
{{EXTRA_SCRIPT}}
</body>
</html>
