name: Deploy preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/cool-dirac-re7hub
      - main
    paths:
      - 'site/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          node scripts/build.js
          node scripts/build-pages.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # This repo has never had Pages enabled before, so ask the action
          # to create/enable the Pages site (build type: workflow) itself
          # rather than erroring when it can't find an existing one.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
