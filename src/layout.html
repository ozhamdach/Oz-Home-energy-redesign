<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The dataLayer array is always declared, preview or production, so the
     phone-click/email-click/form-start/form-step events this build already
     pushes (see site/js/main.js and site/js/commercial-battery-assessment.js)
     never throw even when nothing is listening. The actual GTM/Meta Pixel
     loader scripts are injected here ONLY in a BUILD_TARGET=production
     build — see scripts/build.js and src/partials/analytics-head.html —
     so the staging preview never contacts Google or Meta at all. -->
<script>window.dataLayer = window.dataLayer || [];</script>
{{ANALYTICS_HEAD}}
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<!-- Production origin: https://ozhomeenergy.com.au (non-www). The current
     production site's www subdomain redirects to this apex domain, so every
     canonical/OG/schema URL below uses it consistently — pointing them at
     www would canonicalise against a redirecting hostname. See
     docs/legacy-url-migration.md for the full rationale and migration plan. -->
<link rel="canonical" href="https://ozhomeenergy.com.au{{CANONICAL}}">
<!-- {{ROBOTS_META}} is "noindex, nofollow" by default (preview build) and
     only becomes "index, follow" when scripts/build.js is run with
     BUILD_TARGET=production — see docs/09-seo-preview-safety.md. Never index
     a preview build; keep this in sync with site/robots.txt. -->
<meta name="robots" content="{{ROBOTS_META}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Oz Home Energy">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="https://ozhomeenergy.com.au{{CANONICAL}}">
<meta property="og:image" content="https://ozhomeenergy.com.au/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Oz Home Energy — Sydney solar, battery, EV charging and electrical contractor">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script type="application/ld+json">

{{SCHEMA}}
{{EXTRA_HEAD}}
</head>
<body>
{{ANALYTICS_BODY}}
{{HEADER}}
<main id="main">
{{BODY}}
</main>
{{FOOTER}}
<script src="/js/main.js" defer></script>
{{EXTRA_SCRIPT}}
</body>
</html>
